# The HORIZON loop (docs/AUTOMATION.md, Section 6).  Every 30 minutes, and on demand, one tick:
# poll the Kaggle notebook, collect and verify a finished session, commit it, push the next chunk.
# The runner computes nothing; all work happens on Kaggle.  Secrets: KAGGLE_USERNAME (the account name,
# for the notebook's id) and KAGGLE_KEY (the existing Kaggle API token, given to the tool as KAGGLE_API_TOKEN).
name: horizon-loop

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horizon-loop
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Kaggle command-line tool
        run: python -m pip install --quiet -r requirements-loop.txt
      - name: Tick
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "horizon-loop"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/automation/loop.py tick
